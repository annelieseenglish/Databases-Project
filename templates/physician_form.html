{% extends "base.html" %}
{% block title %}{{ action }} Physician{% endblock %}

{% block content %}
<div class="page-header">
    <h1>{{ action }} Physician</h1>
    <a href="{{ url_for('physicians') }}" class="btn btn-outline">← Back</a>
</div>

<div class="form-card">
    <form method="POST">
        <div class="form-group">
            <label for="license_number">License Number</label>
            <input type="text" id="license_number" name="license_number"
                   value="{{ physician.License_Number if physician else '' }}"
                   placeholder="FL-MD-10008"
                   {% if action == 'Edit' %}readonly{% endif %}
                   required>
            {% if action == 'Edit' %}<small>License number cannot be changed (primary key).</small>{% endif %}
        </div>
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name"
                   value="{{ physician.Name if physician else '' }}"
                   placeholder="Dr. Jane Smith" required>
        </div>
        <div class="form-group">
            <label for="specialty">Specialty</label>
            <input type="text" id="specialty" name="specialty"
                   value="{{ physician.Specialty if physician else '' }}"
                   placeholder="e.g. Family Medicine, Cardiology" required>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">{{ action }} Physician</button>
            <a href="{{ url_for('physicians') }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
